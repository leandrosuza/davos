<!-- Case Opening Modal -->
<div id="case-modal" class="modal">
    <div class="modal-content case-modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-cube"></i> <span id="case-modal-title">Open Case</span></h2>
            <button class="modal-close" onclick="closeCaseModal()">&times;</button>
        </div>
        <div class="modal-body case-body">
            <section class="roulette-section" id="rouletteSection">
                <!-- Roulette Stack - Middle always visible, top/bottom toggleable -->
                <div class="roulette-stack-container" id="rouletteStackContainer">
                    <!-- Top Roulette (hidden when Trick Open off) -->
                    <div class="roulette-layer" id="rouletteLayer1" style="display:none;">
                        <div class="selector-arrow"></div>
                        <div class="roulette-wrapper" id="roulette1"></div>
                    </div>
                    
                    <!-- Middle Roulette (always visible - the main one) -->
                    <div class="roulette-layer" id="rouletteLayer2">
                        <div class="selector-arrow"></div>
                        <div class="roulette-wrapper" id="roulette2"></div>
                    </div>
                    
                    <!-- Bottom Roulette (hidden when Trick Open off) -->
                    <div class="roulette-layer" id="rouletteLayer3" style="display:none;">
                        <div class="selector-arrow"></div>
                        <div class="roulette-wrapper" id="roulette3"></div>
                    </div>
                </div>
                
                <button class="open-btn" id="openBtn" onclick="spinRoulette()"><i class="fas fa-key"></i> Girar</button>
            </section>
        </div>
    </div>
</div>
