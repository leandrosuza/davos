<!-- Battle Pass Modal -->
<div id="battlepass-modal" class="modal">
    <div class="modal-content battlepass-modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-crown"></i> Battle Pass</h2>
            <button class="modal-close" onclick="closeBattlePassModal()">&times;</button>
        </div>
        <div class="modal-body battlepass-body">
            <div class="mockup-content">
                <div class="mockup-icon">
                    <i class="fas fa-crown"></i>
                </div>
                <h3>Temporada 1</h3>
                <p>Desbloqueie recompensas exclusivas subindo de nível no Battle Pass!</p>
                <div class="bp-preview">
                    <div class="bp-level-preview">
                        <span class="current-level">Nível 12</span>
                        <div class="xp-bar-preview">
                            <div class="xp-fill-preview" style="width: 65%"></div>
                        </div>
                        <span class="xp-text-preview">6.500 / 10.000 XP</span>
                    </div>
                    <div class="bp-rewards-preview">
                        <div class="reward-preview locked">
                            <i class="fas fa-lock"></i>
                            <span>Lvl 13</span>
                        </div>
                        <div class="reward-preview locked">
                            <i class="fas fa-lock"></i>
                            <span>Lvl 14</span>
                        </div>
                        <div class="reward-preview premium">
                            <i class="fas fa-gem"></i>
                            <span>Lvl 15</span>
                        </div>
                    </div>
                </div>
                <button class="mockup-btn" onclick="closeBattlePassModal()">
                    <i class="fas fa-crown"></i> Em breve
                </button>
            </div>
        </div>
    </div>
</div>
