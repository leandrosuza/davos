<!-- Boosters Panel (Side Panel for Roulette) -->
<div id="boosters-modal" class="modal">
    <div class="modal-content boosters-modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-bolt"></i> Boosters</h2>
        </div>
        <div class="modal-body boosters-body">
            <!-- Trick Open Button -->
            <div class="trick-open-toggle">
                <div class="trick-open-btn" id="trickOpenBtn" onclick="toggleTrickOpen()">
                    <div class="btn-icon">
                        <i class="fas fa-layer-group"></i>
                    </div>
                    <span class="btn-label">Trick Open</span>
                    <span class="btn-status" id="trickOpenStatus">Desativado</span>
                </div>
            </div>
        </div>
    </div>
</div>
