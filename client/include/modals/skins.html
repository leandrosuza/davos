<!-- Skins Gallery Modal -->
<div id="skinsModal" class="modal-overlay">
    <div class="modal-container skins-modal-container">
        <div class="modal-header">
            <h4 class="modal-title"><i class="fas fa-palette"></i> Customize</h4>
            <button type="button" class="modal-close" onclick="closeSkinsModal()">&times;</button>
        </div>
        <div class="modal-body skins-modal-body">
            <!-- Tabs -->
            <div class="skins-tabs">
                <button class="skins-tab active" onclick="switchSkinsTab('colors', this)">
                    <i class="fas fa-circle"></i> Colors
                </button>
                <button class="skins-tab" onclick="switchSkinsTab('skins', this)">
                    <i class="fas fa-image"></i> Skins
                </button>
            </div>

            <!-- Preview -->
            <div class="skin-preview-area">
                <div class="skin-preview-cell" id="skinPreviewCell">
                    <span id="skinPreviewLabel">?</span>
                </div>
                <div class="skin-preview-info">
                    <span id="skinPreviewName">No selection</span>
                    <button class="skin-clear-btn" onclick="clearSkinSelection()">
                        <i class="fas fa-times"></i> Clear
                    </button>
                </div>
            </div>

            <!-- Colors Tab -->
            <div id="skins-tab-colors" class="skins-tab-content active">
                <p class="skins-section-label">Pick a color for your cell</p>
                <div class="color-palette" id="colorPalette"></div>
                <div class="custom-color-row">
                    <label><i class="fas fa-eyedropper"></i> Custom</label>
                    <input type="color" id="customColorPicker" value="#ff0000" oninput="selectCustomColor(this.value)">
                </div>
            </div>

            <!-- Skins Tab -->
            <div id="skins-tab-skins" class="skins-tab-content">
                <p class="skins-section-label">Choose a skin image</p>
                <div class="skins-image-grid" id="skinsImageGrid"></div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="modal-btn modal-btn-secondary" onclick="closeSkinsModal()">Cancel</button>
            <button type="button" class="modal-btn modal-btn-primary" onclick="applySkinSelection()">
                <i class="fas fa-check"></i> Apply
            </button>
        </div>
    </div>
</div>
