<!-- Settings Modal -->
<div id="settings-modal" class="modal">
    <div class="modal-content settings-modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-cog"></i> Settings</h2>
            <button class="modal-close" onclick="closeSettingsModal()">&times;</button>
        </div>
        <div class="modal-body settings-body">
            <label>
                <input type="checkbox" class="save" data-box-id="1" onchange="setSkins(!$(this).is(':checked'));">
                No skins
            </label>
            <label>
                <input type="checkbox" class="save" data-box-id="2" onchange="setNames(!$(this).is(':checked'));">
                No names
            </label>
            <label>
                <input type="checkbox" class="save" data-box-id="3" onchange="setDarkTheme($(this).is(':checked'));">
                Dark Theme
            </label>
            <label>
                <input type="checkbox" class="save" data-box-id="4" onchange="setColors($(this).is(':checked'));">
                No colors
            </label>
            <label>
                <input type="checkbox" class="save" data-box-id="5" onchange="setShowMass($(this).is(':checked'));">
                Show mass
            </label>
            <label>
                <input type="checkbox" class="save" data-box-id="6" onchange="setSmooth($(this).is(':checked'));">
                Smooth Render
            </label>
            <label>
                <input type="checkbox" class="save" data-box-id="7" onchange="setChatHide($(this).is(':checked'));">
                Hide Chat
            </label>
        </div>
    </div>
</div>
