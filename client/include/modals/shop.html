<!-- Shop Modal -->
<div id="shop-modal" class="modal">
    <div class="modal-content shop-modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-shopping-cart"></i> Shop</h2>
            <button class="modal-close" onclick="closeShopModal()">&times;</button>
        </div>
        <div class="modal-body shop-body">
            <div class="shop-currency">
                <span class="currency-icon"><i class="fas fa-coins"></i></span>
                <span class="currency-amount">1,250</span>
                <span class="currency-label">Coins</span>
            </div>
            <div class="shop-tabs">
                <button class="shop-tab active" onclick="switchShopTab('skins')">Skins</button>
                <button class="shop-tab" onclick="switchShopTab('boosts')">Boosts</button>
                <button class="shop-tab" onclick="switchShopTab('pass')">Davos Pass</button>
            </div>
            <div class="shop-grid" id="shop-skins">
                <div class="shop-item">
                    <div class="item-icon"><i class="fas fa-crosshairs" style="color: #ff4b4b;"></i></div>
                    <div class="item-name">Dragon Skin</div>
                    <div class="item-price"><i class="fas fa-coins"></i> 500</div>
                    <button class="buy-btn" onclick="buyItem('dragon', 500)">Buy</button>
                </div>
                <div class="shop-item">
                    <div class="item-icon"><i class="fas fa-khanda" style="color: #8847ff;"></i></div>
                    <div class="item-name">Karambit Gold</div>
                    <div class="item-price"><i class="fas fa-coins"></i> 800</div>
                    <button class="buy-btn" onclick="buyItem('karambit', 800)">Buy</button>
                </div>
                <div class="shop-item">
                    <div class="item-icon"><i class="fas fa-hand-paper" style="color: #d32ce6;"></i></div>
                    <div class="item-name">Elite Gloves</div>
                    <div class="item-price"><i class="fas fa-coins"></i> 350</div>
                    <button class="buy-btn" onclick="buyItem('gloves', 350)">Buy</button>
                </div>
                <div class="shop-item">
                    <div class="item-icon"><i class="fas fa-fire" style="color: #ff6600;"></i></div>
                    <div class="item-name">Fire Effect</div>
                    <div class="item-price"><i class="fas fa-coins"></i> 600</div>
                    <button class="buy-btn" onclick="buyItem('fire', 600)">Buy</button>
                </div>
                <div class="shop-item">
                    <div class="item-icon"><i class="fas fa-crown" style="color: #ffd700;"></i></div>
                    <div class="item-name">Crown Skin</div>
                    <div class="item-price"><i class="fas fa-coins"></i> 1,000</div>
                    <button class="buy-btn" onclick="buyItem('crown', 1000)">Buy</button>
                </div>
                <div class="shop-item">
                    <div class="item-icon"><i class="fas fa-ghost" style="color: #4b69ff;"></i></div>
                    <div class="item-name">Ghost Mode</div>
                    <div class="item-price"><i class="fas fa-coins"></i> 750</div>
                    <button class="buy-btn" onclick="buyItem('ghost', 750)">Buy</button>
                </div>
            </div>
        </div>
    </div>
</div>
